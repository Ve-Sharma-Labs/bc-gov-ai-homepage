name: PyRIT - Local data and setup contracts
run-name: PyRIT - Local data and setup contracts (${{ github.event_name }} ${{ github.ref_name }})

on:
  pull_request:
    paths:
      - 'data/evaluations/pyrit-*.json'
      - 'evaluations/pyrit/**'
      - 'scripts/pyrit-local.ps1'
      - '.github/skills/pyrit-local/**'
      - '.github/workflows/ci-pyrit-local.yml'
  push:
    branches: [main]
    paths:
      - 'data/evaluations/pyrit-*.json'
      - 'evaluations/pyrit/**'
      - 'scripts/pyrit-local.ps1'
      - '.github/workflows/ci-pyrit-local.yml'

permissions:
  contents: read

jobs:
  contracts:
    name: PyRIT - Local data and setup contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: 'true'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned PyRIT and local test dependencies
        run: python -m pip install -e 'evaluations/pyrit[dev]'
      - name: Check shared data, native imports and fixture-only execution
        run: python -m pytest evaluations/pyrit/tests -q
      - name: Lint the local integration
        run: python -m ruff check evaluations/pyrit/src evaluations/pyrit/tests evaluations/pyrit/copyrit_local_initializer.py
      - name: Parse the Windows entry point
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/pyrit-local.ps1'), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors.Message -join "`n") }
