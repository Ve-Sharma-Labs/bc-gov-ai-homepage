name: BC Gov Sources - Collection
run-name: >-
  BC Gov Sources - Collection | ${{ github.event_name }} | ${{ github.ref_name }}

on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
    inputs:
      initialize:
        description: Initialize a never-initialized checkpoint (does not reset existing budgets)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: official-source-collection
  cancel-in-progress: false

jobs:
  collect:
    name: BC Gov Sources - Collect Freshness Metadata
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Restore exact preceding trusted state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agentic-workflows.mjs restore-source-state
      - name: Collect metadata and explicitly authorized refreshes
        env:
          PYTHONPATH: ingestion
          SOURCE_WATCHDOG_RIGHTS_JSON: ${{ secrets.SOURCE_WATCHDOG_RIGHTS_JSON }}
          SOURCE_WATCHDOG_RIGHTS_SHA256: ${{ vars.SOURCE_WATCHDOG_RIGHTS_SHA256 }}
          INITIALIZE: ${{ steps.restore.outputs.initialize }}
        run: |
          args=(--refresh)
          if [ "$INITIALIZE" = "true" ]; then args+=(--initialize); fi
          python -m bc_ingestion.freshness "${args[@]}"
      - name: Finalize state even after collection failure
        if: always() && steps.restore.outcome == 'success'
        run: node scripts/agentic-workflows.mjs finalize-source-state
      - name: Persist charged checkpoint without response bodies or rights
        if: always() && steps.restore.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-source-state
          path: |
            ingestion/.generated/freshness/checkpoint.json
            ingestion/.generated/freshness/uninitialized.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish sanitized metadata for impact assessment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: official-source-report
          path: ingestion/.generated/freshness/report.json
          if-no-files-found: error
          retention-days: 7
