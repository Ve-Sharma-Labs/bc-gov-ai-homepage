name: BC Gov Web - Build
run-name: >-
  BC Gov Web - Build | ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: BC Gov Web - Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked web dependencies
        run: npm --prefix apps/web ci
      - name: Generate route types and check TypeScript
        run: npm --prefix apps/web run typecheck
      - name: Build and prepare the production web app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
