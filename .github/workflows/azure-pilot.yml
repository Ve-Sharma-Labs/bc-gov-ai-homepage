name: BC Gov App - Azure Deployment
run-name: >-
  BC Gov App - Azure Deployment | ${{ inputs.operation }} | ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [provision, deploy, verify]
        required: true
        description: Reviewed operation; public exposure is separately gated
      public_url:
        type: string
        description: Exact reviewed app origin for verification
      live_checks:
        type: boolean
        default: false
        description: Run up to 18 synthetic chat turns with existing model limits

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-pilot
  cancel-in-progress: false

jobs:
  deploy:
    name: BC Gov App - Provision Reviewed Staging
    if: inputs.operation == 'provision'
    runs-on: ubuntu-latest
    environment: pilot-staging
    concurrency:
      group: pyrit-live-scans
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_PRODUCTION_ENV_NAME: ${{ vars.AZURE_PRODUCTION_ENV_NAME }}
      AZURE_RELEASE_COMMIT: ${{ vars.AZURE_RELEASE_COMMIT }}
      AZURE_RELEASE_PROBE_ENABLED: ${{ vars.AZURE_RELEASE_PROBE_ENABLED }}
      PYRIT_PRODUCTION_CONTEXT_JSON: ${{ vars.PYRIT_PRODUCTION_CONTEXT_JSON }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_PROVISIONING_APPROVED: ${{ vars.AZURE_PROVISIONING_APPROVED }}
      AZURE_DEPLOYMENT_REVIEWED: ${{ vars.AZURE_DEPLOYMENT_REVIEWED }}
      AZURE_MODEL_DEPLOYMENTS: ${{ vars.AZURE_MODEL_DEPLOYMENTS }}
      FOUNDRY_AGENTS: ${{ vars.FOUNDRY_AGENTS }}
      FOUNDRY_GENERAL_AGENT: ${{ vars.FOUNDRY_GENERAL_AGENT }}
      FOUNDRY_CONTEXTUAL_AGENT: ${{ vars.FOUNDRY_CONTEXTUAL_AGENT }}
      FOUNDRY_CONVERSATION_AGENT: ${{ vars.FOUNDRY_CONVERSATION_AGENT }}
      AI_CONVERSATION_ENABLED: ${{ vars.AI_CONVERSATION_ENABLED }}
      TASK_ASSISTANCE_ENABLED: ${{ vars.TASK_ASSISTANCE_ENABLED }}
      AI_CONVERSATION_PRIVACY_REVIEWED: ${{ vars.AI_CONVERSATION_PRIVACY_REVIEWED }}
      SYNTHETIC_CONTEXT_ENABLED: ${{ vars.SYNTHETIC_CONTEXT_ENABLED }}
      AZURE_SYNTHETIC_CONTEXT_APPROVED: ${{ vars.AZURE_SYNTHETIC_CONTEXT_APPROVED }}
      AZURE_SEARCH_SKU: ${{ vars.AZURE_SEARCH_SKU }}
      AZURE_REDIS_SKU: ${{ vars.AZURE_REDIS_SKU }}
      AZURE_API_APPLICATION_CLIENT_ID: ${{ vars.AZURE_API_APPLICATION_CLIENT_ID }}
      AZURE_API_IMAGE_NAME: ${{ vars.AZURE_API_IMAGE_NAME }}
      AZURE_WEB_IMAGE_NAME: ${{ vars.AZURE_WEB_IMAGE_NAME }}
      AZURE_SEARCH_INDEX: ${{ vars.AZURE_SEARCH_INDEX }}
      AZURE_SEARCH_METADATA_ENABLED: ${{ vars.AZURE_SEARCH_METADATA_ENABLED }}
      AZURE_SEARCH_METADATA_REVIEWED: ${{ vars.AZURE_SEARCH_METADATA_REVIEWED }}
      AZURE_PILOT_CONTROLS: ${{ vars.AZURE_PILOT_CONTROLS }}
      AZURE_NETWORK_PREFIX: ${{ vars.AZURE_NETWORK_PREFIX }}
      AZURE_APPS_SUBNET_PREFIX: ${{ vars.AZURE_APPS_SUBNET_PREFIX }}
      AZURE_PRIVATE_SUBNET_PREFIX: ${{ vars.AZURE_PRIVATE_SUBNET_PREFIX }}
      AZURE_DEPLOYMENT_STAGE: ${{ vars.AZURE_DEPLOYMENT_STAGE }}
      AZURE_VALIDATION_CIDRS: ${{ vars.AZURE_VALIDATION_CIDRS }}
      AZURE_PRIVATE_ORIGIN_APPROVED: ${{ vars.AZURE_PRIVATE_ORIGIN_APPROVED }}
      AZURE_PUBLIC_PREVIEW_APPROVED: ${{ vars.AZURE_PUBLIC_PREVIEW_APPROVED }}
      AZURE_LIVE_EVALUATION_APPROVED: ${{ vars.AZURE_LIVE_EVALUATION_APPROVED }}
      AZURE_SOURCE_PUBLICATION_APPROVED: ${{ vars.AZURE_SOURCE_PUBLICATION_APPROVED }}
      AZURE_BC_BRAND_APPROVED: ${{ vars.AZURE_BC_BRAND_APPROVED }}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
      AZURE_OPENAI_EMBEDDING_DIMENSIONS: ${{ vars.AZURE_OPENAI_EMBEDDING_DIMENSIONS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refuse unreviewed context or exposure
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          node scripts/azure-preflight.mjs --operation=provision
      - uses: Azure/setup-azd@v2
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate azd without stored credentials
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Load the reviewed environment
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt
          for key in AZURE_SUBSCRIPTION_ID AZURE_LOCATION AZURE_MODEL_DEPLOYMENTS FOUNDRY_AGENTS FOUNDRY_GENERAL_AGENT FOUNDRY_CONTEXTUAL_AGENT FOUNDRY_CONVERSATION_AGENT AI_CONVERSATION_ENABLED TASK_ASSISTANCE_ENABLED AI_CONVERSATION_PRIVACY_REVIEWED SYNTHETIC_CONTEXT_ENABLED AZURE_SEARCH_INDEX AZURE_SEARCH_METADATA_ENABLED AZURE_SEARCH_METADATA_REVIEWED AZURE_SEARCH_SKU AZURE_REDIS_SKU AZURE_API_APPLICATION_CLIENT_ID AZURE_API_IMAGE_NAME AZURE_WEB_IMAGE_NAME AZURE_PILOT_CONTROLS AZURE_NETWORK_PREFIX AZURE_APPS_SUBNET_PREFIX AZURE_PRIVATE_SUBNET_PREFIX AZURE_DEPLOYMENT_STAGE AZURE_VALIDATION_CIDRS AZURE_OPENAI_EMBEDDING_DEPLOYMENT AZURE_OPENAI_EMBEDDING_DIMENSIONS AZURE_RELEASE_COMMIT AZURE_RELEASE_PROBE_ENABLED; do
            if [ -n "${!key}" ]; then azd env set "$key" "${!key}"; fi
          done
      - name: Reject production changes in the staging what-if
        run: |
          az deployment sub what-if --subscription "$AZURE_SUBSCRIPTION_ID" \
            --location "$AZURE_LOCATION" --template-file infra/main.bicep \
            --parameters infra/main.bicepparam --no-pretty-print > "$RUNNER_TEMP/staging-whatif.json"
          node scripts/validate-staging-provision.mjs "$RUNNER_TEMP/staging-whatif.json"
      - name: Provision the reviewed staging environment
        run: azd provision --no-prompt
  offline:
    name: BC Gov App - Require Offline Red Teaming
    if: inputs.operation == 'deploy'
    uses: ./.github/workflows/ci-pyrit.yml
    permissions:
      contents: read
  build:
    name: BC Gov App - Build Immutable Candidate
    if: inputs.operation == 'deploy'
    needs: offline
    runs-on: ubuntu-latest
    environment: pilot-staging
    env:
      PYRIT_STAGING_CONTEXT_JSON: ${{ vars.PYRIT_STAGING_CONTEXT_JSON }}
      PYRIT_RELEASE_ENABLED: ${{ vars.PYRIT_RELEASE_ENABLED }}
      AZURE_DEPLOYMENT_REVIEWED: ${{ vars.AZURE_DEPLOYMENT_REVIEWED }}
    steps:
      - name: Set the job-owned registry login directory
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/pyrit-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require trusted release activation
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$PYRIT_RELEASE_ENABLED" == "1" ]]
          [[ "$AZURE_DEPLOYMENT_REVIEWED" == "1" ]]
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build once and record registry digests
        run: |
          registry=$(node --input-type=module -e "import {deploymentContext} from './scripts/azure-pyrit.mjs'; console.log(deploymentContext(JSON.parse(process.env.PYRIT_STAGING_CONTEXT_JSON)).registryName)")
          mkdir -p "$DOCKER_CONFIG"
          az acr login --name "$registry"
          for component in api web; do
            image="$registry.azurecr.io/bc-government-assistant/$component:$GITHUB_SHA"
            docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --file "apps/$component/Dockerfile" --tag "$image" .
            docker push "$image"
            digest=$(az acr repository show --name "$registry" --image "bc-government-assistant/$component:$GITHUB_SHA" --query digest --output tsv)
            if [ "$component" = "api" ]; then export PYRIT_API_IMAGE="$registry.azurecr.io/bc-government-assistant/api@$digest";
            else export PYRIT_WEB_IMAGE="$registry.azurecr.io/bc-government-assistant/web@$digest"; fi
          done
          node scripts/pyrit-release.mjs images --output images.json
      - uses: actions/upload-artifact@v4
        with:
          name: pyrit-images-${{ github.run_attempt }}
          path: images.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove the job-owned registry login
        if: always()
        run: |
          if [ -f "$DOCKER_CONFIG/config.json" ]; then rm -- "$DOCKER_CONFIG/config.json"; fi
  stage:
    name: BC Gov App - Deploy and Verify Staging
    needs: build
    runs-on: ${{ vars.PYRIT_RUNNER_LABEL }}
    environment: pilot-staging
    concurrency:
      group: pyrit-live-scans
      cancel-in-progress: false
    env:
      PYRIT_STAGING_CONTEXT_JSON: ${{ vars.PYRIT_STAGING_CONTEXT_JSON }}
      PYRIT_PRODUCTION_CONTEXT_JSON: ${{ vars.PYRIT_PRODUCTION_CONTEXT_JSON }}
      PYRIT_RELEASE_ENABLED: ${{ vars.PYRIT_RELEASE_ENABLED }}
      PYRIT_LIVE_APPROVED: ${{ vars.PYRIT_LIVE_APPROVED }}
      PYRIT_LIMITS_JSON: ${{ vars.PYRIT_LIMITS_JSON }}
      PYRIT_MODELS_JSON: ${{ vars.PYRIT_MODELS_JSON }}
      AZURE_DEPLOYMENT_REVIEWED: ${{ vars.AZURE_DEPLOYMENT_REVIEWED }}
      AZURE_PRIVATE_ORIGIN_APPROVED: ${{ vars.AZURE_PRIVATE_ORIGIN_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: pyrit-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pyrit-images
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare the candidate without touching production
        run: node scripts/pyrit-release.mjs stage --images "$RUNNER_TEMP/pyrit-images/images.json" --output candidate.json
      - uses: actions/upload-artifact@v4
        with:
          name: pyrit-candidate-${{ github.run_attempt }}
          path: candidate.json
          if-no-files-found: error
          retention-days: 7
  red-team:
    name: BC Gov App - Require Live AI Red Teaming
    needs: stage
    uses: ./.github/workflows/pyrit-ai-red-teaming.yml
    permissions:
      contents: read
      id-token: write
    with:
      candidate_artifact: pyrit-candidate-${{ github.run_attempt }}
  promote:
    name: BC Gov App - Promote Qualified Revision Pair
    needs: [offline, red-team]
    if: needs.red-team.result == 'success' && needs.red-team.outputs.qualified == 'true'
    runs-on: ${{ vars.PYRIT_RUNNER_LABEL }}
    environment: pilot
    timeout-minutes: 30
    env:
      PYRIT_STAGING_CONTEXT_JSON: ${{ vars.PYRIT_STAGING_CONTEXT_JSON }}
      PYRIT_PRODUCTION_CONTEXT_JSON: ${{ vars.PYRIT_PRODUCTION_CONTEXT_JSON }}
      PYRIT_RELEASE_ENABLED: ${{ vars.PYRIT_RELEASE_ENABLED }}
      PYRIT_LIVE_APPROVED: ${{ vars.PYRIT_LIVE_APPROVED }}
      PYRIT_LIMITS_JSON: ${{ vars.PYRIT_LIMITS_JSON }}
      PYRIT_MODELS_JSON: ${{ vars.PYRIT_MODELS_JSON }}
      AZURE_DEPLOYMENT_REVIEWED: ${{ vars.AZURE_DEPLOYMENT_REVIEWED }}
      AZURE_PRIVATE_ORIGIN_APPROVED: ${{ vars.AZURE_PRIVATE_ORIGIN_APPROVED }}
      AZURE_PUBLIC_PREVIEW_APPROVED: ${{ vars.AZURE_PUBLIC_PREVIEW_APPROVED }}
      AZURE_LIVE_EVALUATION_APPROVED: ${{ vars.AZURE_LIVE_EVALUATION_APPROVED }}
      AZURE_SOURCE_PUBLICATION_APPROVED: ${{ vars.AZURE_SOURCE_PUBLICATION_APPROVED }}
      AZURE_BC_BRAND_APPROVED: ${{ vars.AZURE_BC_BRAND_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.offline.outputs.artifact_name }}
          path: ${{ runner.temp }}/pyrit-offline
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.red-team.outputs.report_artifact }}
          path: ${{ runner.temp }}/pyrit-live
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Recheck qualification, probe the private pair, and switch traffic
        run: |
          node scripts/pyrit-release.mjs promote \
            --candidate "$RUNNER_TEMP/pyrit-live/candidate.json" \
            --report "$RUNNER_TEMP/pyrit-live/report.json" \
            --offline "$RUNNER_TEMP/pyrit-offline/report.json" --output deployment-marker.json
      - name: Publish the verified production marker
        uses: actions/upload-artifact@v4
        with:
          name: deployment-marker
          path: deployment-marker.json
          if-no-files-found: error
          retention-days: 7
  verify:
    name: BC Gov App - Verify Azure Deployment
    if: inputs.operation == 'verify'
    runs-on: ubuntu-latest
    environment: pilot
    permissions:
      contents: read
    env:
      PILOT_BASE_URL: ${{ inputs.public_url }}
      LIVE_CHECKS: ${{ inputs.live_checks }}
      AZURE_LIVE_EVALUATION_APPROVED: ${{ vars.AZURE_LIVE_EVALUATION_APPROVED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the deployed conversation rather than HTTP success alone
        run: |
          args=("--url=$PILOT_BASE_URL")
          if [ "$LIVE_CHECKS" = "true" ]; then
            if [ "$AZURE_LIVE_EVALUATION_APPROVED" != "1" ]; then
              echo "Explicit live-evaluation approval is required; no model calls were made."
              exit 1
            fi
            args+=("--live-approved")
          fi
          node scripts/verify-pilot-chat.mjs "${args[@]}"
