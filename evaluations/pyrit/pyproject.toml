[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "bc-pyrit"
version = "0.1.0"
description = "Bounded PyRIT checks and stateful CoPyRIT target for BC assistant staging."
requires-python = ">=3.14,<3.15"
dependencies = [
  "pyrit==1.2.0",
  "httpx==0.28.1",
  "azure-identity==1.27.0",
  "pydantic>=2.12,<3",
  "jsonschema>=4.25,<5",
  "PyYAML>=6,<7",
  "python-dotenv>=1.2,<2",
  "uvloop==0.23.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.1"]

[project.scripts]
bc-pyrit = "bc_pyrit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bc_pyrit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
